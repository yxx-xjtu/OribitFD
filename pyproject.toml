[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitfd"
version = "0.1.0"
description = "OrbitFD: Finite-Support Prototype Orbits for Open-Set Fault Diagnosis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["orbitfd*"]
